# jobstitch model configuration
# =============================
# jobstitch calls exactly three models, one per job, all through the SAME
# provider (jobstitch assumes a single API key):
#
#   summary    JD detection, JD analysis and the cover letter
#   cv         CV writing and the content review
#   highlight  the **bold**/*italic* keyword pass over the validated CV
#
# [provider] declares the endpoint once; each [models.*] table below is just
# the model name and generation settings for that job. Any OpenAI-compatible
# /chat/completions endpoint works — point base_url (or base_url_env) at it
# and set each model's `model` to whatever your account has access to.
#
# Docker: model, temperature, thinking and structured_output can each be
# overridden per role with an env var, without touching this file —
# JOBSTITCH_<ROLE>_<FIELD>, e.g. JOBSTITCH_CV_MODEL, JOBSTITCH_CV_TEMPERATURE,
# JOBSTITCH_CV_THINKING, JOBSTITCH_CV_STRUCTURED_OUTPUT (roles: SUMMARY, CV,
# HIGHLIGHT). See .env.example.

[provider]
api_key_env  = "MODEL_API_KEY"
base_url_env = "MODEL_BASE_URL"

[defaults]
timeout_seconds = 600


# --- Per-model settings -------------------------------------------------
# model           (required) model name sent to the endpoint
# temperature     sampling temperature; omit to use the provider default
# max_tokens      overrides [defaults].max_tokens for this model; omitted here
#                 and in [defaults] means max_tokens is left out of the request
#                 entirely and the provider's own default applies. Set it when
#                 the endpoint caps completion tokens (e.g. DashScope's
#                 max_tokens range is [1, 8192] for some models)
# reasoning_effort  "low" | "medium" | "high"; omit for the provider default
# thinking        "auto" (send nothing — the provider decides, and the right
#                 value for endpoints that reject a thinking switch, e.g.
#                 OpenAI) | "on" (enable_thinking, plus `thinking_budget` when
#                 set) | "off" (force reasoning off)
# thinking_budget cap on reasoning tokens per call; needs thinking = "on"
# web_search      true when the endpoint runs web search server-side
# structured_output  "json_schema_strict" (endpoint validates the schema and
#                   rejects anything off it) | "json_schema" (schema sent as a
#                   hint) | "json_object" (JSON but no schema) | "none".
#                   jobstitch also restates the schema in the prompt and
#                   validates every reply, so "json_object" still works.
# Note: reasoning_effort and thinking_budget are mutually exclusive — a
# declared thinking_budget always wins and reasoning_effort is dropped.

# Mid-size: decides whether the clipboard holds a job description, extracts
# the JD analysis, and writes the cover letter. The only model allowed to run
# web research (on the employer, for a direct posting from a named company).
[models.summary]
model             = "qwen3.8-flash"
structured_output = "json_object"
temperature       = 0.1
thinking          = "on"
reasoning_effort  = "low"
# DashScope runs web search server-side via extra_body {"enable_search": true}.
web_search        = true

# The large one: writes the tailored CV and reviews it. Thinking is worth
# paying for here, capped so a long reasoning chain cannot eat the output
# budget and truncate the JSON.
#
# The model name is load-bearing: `qwen-max` accepts `response_format`
# json_schema and `enable_thinking` and then silently honours neither (probed
# directly — it answers with the master profile's own shape, including
# `bullet_points` as a bullet *count*, and reports no reasoning tokens).
# `qwen3.8-max` enforces the schema. max_tokens is declared because reasoning
# tokens come out of the completion budget, and the provider default leaves
# too little behind for the JSON.
[models.cv]
model             = "qwen3.8-max"
structured_output = "json_schema_strict"
max_tokens        = 16000
thinking          = "on"
thinking_budget   = 6000

# Mid-size, no thinking: the highlighter only inserts Markdown markers into
# already-validated JSON. Letting a hybrid-reasoning model think about that
# burns the whole output budget on reasoning tokens and returns truncated JSON.
[models.highlight]
model             = "qwen3.8-flash"
structured_output = "json_object"
temperature       = 0.1
thinking          = "off"


